# ============================================================================
# SubCast Olvasó — APK-építés a felhőben, ÁLLANDÓ ALÁÍRÁSSAL
#
# MIÉRT FONTOS AZ ÁLLANDÓ ALÁÍRÁS
# Az Android csak akkor tekint egy APK-t az előző FRISSÍTÉSÉNEK — és őrzi meg
# az adatait: a kijelölt mappát, a párosítást, a haladást —, ha ugyanazzal a
# kulccsal van aláírva. A GitHub gépe minden futásnál új „debug" kulcsot
# csinálna, tehát minden build más aláírást kapna, és telepítés előtt le
# kellene törölni az appot, mindenestül.
#
# A megoldás: az első futás legenerál egy kulcstárat, és visszaírja a repóba
# (signing/subcast.keystore). Minden későbbi build ezt használja.
#
# TUDNI VALÓ: a kulcstár a repóban van. Sideload-hoz (Play Store nélküli
# telepítéshez) ez elfogadható — a kulcs semmihez nem ad hozzáférést, csak azt
# jelenti, hogy más is tudna ezzel aláírt APK-t készíteni. Ha valaha Play
# Store-ba kerülne az app, akkor GitHub Secretbe tett kulcs kell helyette.
# ============================================================================
name: Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write        # a Release feltöltéséhez ÉS a kulcstár megőrzéséhez

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      # ---- ÁLLANDÓ ALÁÍRÓ KULCS ----
      - name: Állandó aláíró kulcs
        run: |
          set -e
          if [ ! -f signing/subcast.keystore ]; then
            echo "Nincs kulcstar - letrehozom, es megorzom a repoban."
            mkdir -p signing
            keytool -genkeypair -v \
              -keystore signing/subcast.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=SubCast Olvaso, OU=zoll86, O=zoll86, L=Budapest, C=HU"
            git config user.name  "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/subcast.keystore
            git commit -m "Allando APK-alairo kulcs (a frissitesek adatvesztes nelkul telepednek)"
            git push
            echo "ELSO FUTAS: a kulcs elkeszult."
          else
            echo "Megvan az allando kulcstar, ezzel irjuk ala."
          fi
          mkdir -p ~/.android
          cp signing/subcast.keystore ~/.android/debug.keystore

      # ---- a webapp fájljai a Capacitor www mappájába ----
      - name: Web fájlok összegyűjtése
        run: |
          set -e
          rm -rf www && mkdir -p www
          cp index.html sw.js manifest.webmanifest www/
          cp -r css js icons www/
          echo "www tartalma:" && find www -type f | sort

      # ---- Capacitor: az Android-projektet ITT generáljuk ----
      - name: Capacitor és Android-projekt
        run: |
          set -e
          npm install
          npx cap add android
          npx cap sync android
          grep -q "mappa-plugin" android/capacitor.settings.gradle \
            && echo "OK: a Mappa-plugin regisztralva" \
            || (echo "HIBA: a Mappa-plugin nem kerult be" && exit 1)

      # ---- sötét rendszersávok (a nav-sáv fehér csíkja ellen) ----
      - name: Sötét rendszersávok
        run: |
          F=android/app/src/main/res/values/styles.xml
          if [ -f "$F" ] && ! grep -q navigationBarColor "$F"; then
            sed -i 's|<item name="windowNoTitle">true</item>|<item name="windowNoTitle">true</item>\n        <item name="android:statusBarColor">#0B0A0E</item>\n        <item name="android:navigationBarColor">#0B0A0E</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:windowLightNavigationBar">false</item>|' "$F"
            echo "sotet savok beirva"
          fi

      - name: App-ikonok
        run: |
          mkdir -p assets
          cp icons/icon-512.png assets/logo.png
          cp icons/icon-512.png assets/logo-dark.png
          npx @capacitor/assets generate --android || echo "ikon-generalas kihagyva"
          npx cap sync android

      # ---- ALÁÍRÁS EXPLICIT BEKÖTÉSE ----
      # Nem bízunk a ~/.android/debug.keystore alapértelmezésben: a CI-n a Gradle
      # helyette friss kulcsot generálhat, és akkor minden build más aláírású lesz.
      # Ha a beírás nem sikerül, a build ELBUKIK — ez a hiba ne csússzon át némán.
      - name: Aláírás bekötése a Gradle-be
        run: |
          python3 - <<'PY'
          import io, os, re, sys
          f = 'android/app/build.gradle'
          ks = os.path.join(os.environ['GITHUB_WORKSPACE'], 'signing', 'subcast.keystore')
          s = io.open(f).read()
          if 'signingConfigs' in s:
              print('mar be van kotve'); sys.exit(0)
          blk = ("    signingConfigs {\n"
                 "        subcast {\n"
                 "            storeFile file('" + ks + "')\n"
                 "            storePassword 'android'\n"
                 "            keyAlias 'androiddebugkey'\n"
                 "            keyPassword 'android'\n"
                 "        }\n"
                 "    }\n")
          m = re.search(r'android\s*\{', s)
          if not m:
              print('HIBA: nincs android blokk'); sys.exit(1)
          s = s[:m.end()] + '\n' + blk + s[m.end():]
          if re.search(r'buildTypes\s*\{', s):
              s = re.sub(r'(buildTypes\s*\{)',
                         r'\1\n        debug { signingConfig signingConfigs.subcast }',
                         s, count=1)
          else:
              s = re.sub(r'(signingConfigs \{[\s\S]*?\n    \}\n)',
                         r'\1    buildTypes { debug { signingConfig signingConfigs.subcast } }\n',
                         s, count=1)
          io.open(f, 'w').write(s)
          print('OK: alairas bekotve ->', ks)
          PY
          grep -n "subcast" android/app/build.gradle

      - name: APK építése
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK átnevezése
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk subcast-olvaso.apk
          echo "APK merete: $(du -h subcast-olvaso.apk | cut -f1)"

      # ---- ELLENŐRZÉS: ha nem az állandó kulccsal készült, a build ELBUKIK ----
      - name: Aláírás ellenőrzése
        run: |
          KS_FP=$(keytool -list -keystore signing/subcast.keystore -storepass android \
            -alias androiddebugkey -v | grep "SHA256:" | head -1 \
            | sed 's/.*SHA256: //' | tr -d ': ' | tr 'A-F' 'a-f')
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK_FP=$("$APKSIGNER" verify --print-certs subcast-olvaso.apk \
            | grep -i "SHA-256 digest" | head -1 | sed 's/.*: //' | tr -d ': ' | tr 'A-F' 'a-f')
          echo "kulcstar : $KS_FP"
          echo "apk      : $APK_FP"
          if [ -z "$KS_FP" ] || [ "$KS_FP" != "$APK_FP" ]; then
            echo "HIBA: az APK NEM az allando kulccsal van alairva!"
            exit 1
          fi
          echo "OK: az APK az allando kulccsal keszult."

      - name: Release frissítése
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "SubCast Olvaso - legfrissebb APK"
          body: |
            Automatikus epites. Toltsd le a .apk fajlt a telefonodra es telepitsd.

            Az APK allando kulccsal van alairva, ezert a kovetkezo verziok
            FRISSITESKENT telepednek: a kijelolt mappa, a parositas es a
            hallgatasi haladas megmarad.
          files: subcast-olvaso.apk
          prerelease: false
